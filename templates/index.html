<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dollar Universe & SAP Connectivity Monitor</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f9; margin: 0; padding: 24px; color: #333; }
    .container { max-width: 960px; margin: 0 auto; background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #edf2f7; padding-bottom: 16px; margin-bottom: 20px; }
    .controls { display: flex; gap: 12px; align-items: center; margin-bottom: 20px; }
    select, button { padding: 8px 14px; font-size: 14px; border: 1px solid #cbd5e1; border-radius: 6px; }
    button { background: #2563eb; color: #fff; cursor: pointer; border: none; font-weight: 500; }
    button:hover { background: #1d4ed8; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
    th { background: #f8fafc; color: #475569; }
    .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; }
    .badge-up { background: #dcfce7; color: #166534; }
    .badge-down { background: #fee2e2; color: #991b1b; }
    .timer { font-size: 13px; color: #64748b; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2>Connectivity Dashboard (DU ⟷ SAP)</h2>
    <div class="timer" id="timerDisplay">Next auto-refresh in: 05:00</div>
  </div>

  <div class="controls">
    <label for="serverFilter"><strong>Filter Destination:</strong></label>
    <select id="serverFilter" onchange="filterTable()">
      <option value="ALL">All Servers</option>
    </select>
    <button onclick="triggerCheck()">🔄 Refresh Now</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Source (DU Node)</th>
        <th>Target Host</th>
        <th>Environment / Label</th>
        <th>Status</th>
        <th>Latency</th>
        <th>Last Checked</th>
      </tr>
    </thead>
    <tbody id="statusTableBody">
      <tr><td colspan="6" style="text-align: center;">Loading targets...</td></tr>
    </tbody>
  </table>
</div>

<script>
  let targets = [];
  let countdownSeconds = 300; // 5 minutes

  // 1. Fetch target list from backend and populate dropdown
  async function loadTargets() {
    const res = await fetch('/api/targets');
    targets = await res.json();

    const select = document.getElementById('serverFilter');
    select.innerHTML = '<option value="ALL">All Servers</option>';
    targets.forEach(t => {
      const opt = document.createElement('option');
      opt.value = t.id;
      opt.textContent = `${t.source} ➔ ${t.dest} (${t.label})`;
      select.appendChild(opt);
    });
    
    // Initial run
    triggerCheck();
  }

  // 2. Trigger ping checks on the backend
  async function triggerCheck() {
    countdownSeconds = 300; // Reset 5-minute timer
    const tbody = document.getElementById('statusTableBody');
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Pinging targets, please wait...</td></tr>';

    try {
      const res = await fetch('/api/check-connectivity', { method: 'POST' });
      const result = await res.json();
      renderTable(result.data, result.timestamp);
    } catch (err) {
      tbody.innerHTML = '<tr><td colspan="6" style="color:red; text-align:center;">Failed to test connectivity.</td></tr>';
    }
  }

  // 3. Render results into the table
  function renderTable(results, timestamp) {
    const selectedFilter = document.getElementById('serverFilter').value;
    const tbody = document.getElementById('statusTableBody');
    tbody.innerHTML = '';

    results.forEach(item => {
      const targetMeta = targets.find(t => t.id === item.target_id);
      if (!targetMeta) return;

      if (selectedFilter !== "ALL" && targetMeta.id != selectedFilter) return;

      const isUp = item.status === "UP";
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><strong>${targetMeta.source}</strong></td>
        <td><code>${item.host}</code></td>
        <td>${targetMeta.label}</td>
        <td><span class="badge ${isUp ? 'badge-up' : 'badge-down'}">${item.status}</span></td>
        <td>${item.latency_ms ? item.latency_ms + ' ms' : '--'}</td>
        <td style="color:#64748b; font-size:12px;">${timestamp}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  function filterTable() {
    triggerCheck();
  }

  // 4. Timer interval (counts down every second, triggers auto-check at 0)
  setInterval(() => {
    countdownSeconds--;
    const mins = String(Math.floor(countdownSeconds / 60)).padStart(2, '0');
    const secs = String(countdownSeconds % 60).padStart(2, '0');
    document.getElementById('timerDisplay').textContent = `Next auto-refresh in: ${mins}:${secs}`;

    if (countdownSeconds <= 0) {
      triggerCheck();
    }
  }, 1000);

  // Initialize
  loadTargets();
</script>

</body>
</html>
